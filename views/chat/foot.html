                },
                startrecorder: function () {
                    let audioTarget = document.getElementById('audio');
                    var types = ["video/webm",
                        "audio/webm",
                        "video/webm\;codecs=vp8",
                        "video/webm\;codecs=daala",
                        "video/webm\;codecs=h264",
                        "audio/webm\;codecs=opus",
                        "video/mpeg"];
                    var suporttype = "";
                    for (var i in types) {
                        if (MediaRecorder.isTypeSupported(types[i])) {
                            suporttype = types[i];
                        }
                    }
                    if (!suporttype) {
                        mui.toast("编码不支持")
                        return;
                    }

                    this.duration = new Date().getTime();
                    //video 摄像头   ，audio 音频
                    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                        .then(function (stream) {
                            this.showprocess = true
                            this.recorder = new MediaRecorder(stream);
                            audioTarget.srcObject = stream;
                            //是否可用
                            this.recorder.ondataavailable = (event) => {
                                console.log("ondataavailable");
                                uploadblob("attach/upload", event.data, ".mp3", res => {
                                    var duration = Math.ceil((new Date().getTime() - this.duration) / 1000);
                                    this.sendaudiomsg(res.Data, duration);
                                })
                                stream.getTracks().forEach(function (track) {
                                    track.stop();
                                });
                                this.showprocess = false
                            }
                            this.recorder.start();
                        }.bind(this)).
                        catch(function (err) {
                            console.log(err)
                            mui.toast(err)
                            this.showprocess = false
                        }.bind(this));

                },

                },
                loaddoutures: function () {
                    var res = [];
                    var config = this.doutu.config;
                    for (var i in config.pkgids) {
                        res[config.pkgids[i]] = (config.baseurl + "/" + config.pkgids[i] + "/info.json")
                    }
                    var that = this;
                    for (var id in res) {
                        this.$http.get(res[id]).then(response => {
                            pkginfo = response.data
                            var baseurl = config.baseurl + "/" + pkginfo.id + "/"
                            // console.log("post res[i]",id,res[id],pkginfo)
                            for (var j in pkginfo.assets) {
                                pkginfo.assets[j] = baseurl + pkginfo.assets[j];
                            }
                            pkginfo.icon = baseurl + pkginfo.icon;
                            that.doutu.packages.push(pkginfo)
                            if (that.doutu.choosed.pkgid == pkginfo.id) {
                                that.doutu.choosed.assets = pkginfo.assets;
                            }

                        })
                    }
                },
                showweixin: function () {
                    mui.alert("请加微信号msb-shenzhuan索取")
                },
                showmsg: function (user, msg, isReverse, isFirst, livePending) {
                    //console.log(">>>>>>>>>>>", user)
                    // console.log(">>>>>>>>>>>", msg)
                    var data = {
                    }
                    data.ismine = userId() == msg.userId;
                    //渲染时已知对端游标则直接标记"已读"（历史回灌与实时同一路径）
                    if (data.ismine && (this.convReadSeq[this.currentConvId()] || 0) > 0) {
                        data.read = true
                    }
                    if (livePending) {
                        data.mstat = 'sending'  //本地新发送气泡：等待 Type=6 ACK 定状态
                        data.seq = 0            //seq 由 ACK 回填，群"N人已读"只对有 seq 的气泡计数
                    }
                    //console.log(data.ismine,userId(),msg.userid)
                    data.user = user;
                    data.msg = msg;
                    console.log(this.msglist)
                    if (isReverse) {
                        this.msglist = [data].concat(this.msglist);
                    } else {
                        //首次获取消息渲染
                        if (isFirst) {
                            this.msglist = [data].concat(this.msglist);
                            //下拉获取消息渲染
                        } else {
                            this.msglist = this.msglist.concat(data)
                        }
                    }
                    this.reset();
                    var that = this;
                    that.timer = setTimeout(function () {
                        window.scrollTo(0, document.getElementById("convo").offsetHeight);
                        if (!isReverse) {
                            let scroll = document.querySelector("#convo .mui-scroll-wrapper").offsetHeight;
                            let inner = document.querySelector("#convo .mui-scroll").offsetHeight;
                            let y = scroll - inner - 80;
                            let transform = document.querySelector("#convo .mui-scroll").style.transform;
                            document.querySelector("#convo .mui-scroll").style.transform = 'translateY(' + y + 'px)';
                        } else {
                            document.querySelector("#convo .mui-scroll").style.transform = 'translateY(' + 0 + 'px)';
                        }



                        clearTimeout(that.timer)
                    }, 100)
                    return data
                },
                // ===== 发送确认(ACK)状态机：dispatchSend/_trySend/ackMsg/retryMsg/flushPending =====
                dispatchSend: function (msg) {
                    if (!msg.clientMsgId) msg.clientMsgId = this.genMsgId();
                    // 私聊本地先挂气泡并置 pending；群聊维持原 UX(自己不弹泡，其他成员经落盘分发收到)
                    var bubble = (msg.Type == 1) ? this.showmsg(userInfo(), msg, false, false, true) : null;
                    this.pending[msg.clientMsgId] = { msg: msg, bubble: bubble, tries: 0, timer: null };
                    this._persistPending(); // 崩溃/刷新不丢未确认消息（localStorage 兜底，重连自动补发）
                    this._trySend(msg.clientMsgId);
                },
                _trySend: function (id) {
                    var that = this;
                    var p = this.pending[id];
                    if (!p) return;
                    if (this.webSocket && this.webSocket.readyState === 1) {
                        this.webSocket.send(JSON.stringify(p.msg));
                        if (p.bubble) Vue.set(p.bubble, 'mstat', 'sending');
                        p.tries++;
                    } else {
                        if (p.bubble) Vue.set(p.bubble, 'mstat', 'wait'); // 断线：onopen 统一补发
                    }
                    clearTimeout(p.timer);
                    p.timer = setTimeout(function () {
                        var q = that.pending[id];
                        if (!q) return;
                        if (q.tries <= 3) {
                            that._trySend(id); // 超时重发同 clientMsgId：服务端幂等命中会回补原 ACK(带 Seq/MsgId)
                        } else {
                            delete that.pending[id];
                            that._persistPending();
                            if (q.bubble) Vue.set(q.bubble, 'mstat', 'fail');
                        }
                    }, 10000);
                },
                ackMsg: function (data) {
                    var that = this;
                    var id = data.ClientMsgId;
                    var p = this.pending[id];
                    if (!p) return; // 迟到/重放补发的 ACK：无 pending 即无需对账
                    clearTimeout(p.timer);
                    if (data.Status === 0) {
                        delete this.pending[id];
                        this._persistPending();
                        if (!p.bubble) return;
                        Vue.set(p.bubble, 'mstat', 'sent');
                        if (data.Seq) Vue.set(p.bubble, 'seq', data.Seq); // seq 回填：群"N人已读"徽章的对账依据
                        if (data.MsgId) p.mid = data.MsgId;
                        return
                    }
                    // 准入闸红区拒绝（server_busy）：保留 pending，5s/10s/20s 指数退避重发同一 clientMsgId
                    // ——切断"超时立即重发"在过载期把入口打成正反馈的放大器；服务端幂等保证不重复落库。
                    if (data.Reason && data.Reason.indexOf('server_busy') === 0 && (p.busy || 0) < 3) {
                        p.busy = (p.busy || 0) + 1
                        p.timer = setTimeout(function () {
                            var q = that.pending[id];
                            if (q) that._trySend(id)
                        }, 5000 * Math.pow(2, p.busy - 1))
                        if (p.bubble) Vue.set(p.bubble, 'mstat', 'sending')
                        return
                    }
                    delete this.pending[id];
                    this._persistPending();
                    if (p.bubble) {
                        Vue.set(p.bubble, 'mstat', 'fail');
                        if (data.Reason) mui.toast('发送失败：' + data.Reason);
                    }
                },
                retryMsg: function (item) { // 失败气泡点击重发：复用同一 clientMsgId，绝不产生第二条落库
                    var id = item.msg.clientMsgId;
                    if (!id) return;
                    if (this.pending[id]) { this._trySend(id); return; }
                    this.pending[id] = { msg: item.msg, bubble: item, tries: 0, timer: null };
                    this._trySend(id);
                },
                flushPending: function () { // 重连成功：pending 全量补发（先清零 tries，给新一轮 3 次机会）
                    this.restorePending(); // 先并回 localStorage 里跨刷新幸存的未确认消息
                    for (var id in this.pending) {
                        var p = this.pending[id];
                        p.tries = 0;
                        this._trySend(id);
                    }
                },
                _persistPending: function () {
                    try {
                        var out = {}
                        for (var id in this.pending) { out[id] = { msg: this.pending[id].msg } }
                        localStorage.setItem('pending:' + userId(), JSON.stringify(out))
                    } catch (e) { /* 容量满/隐私模式：降级为仅内存 pending，不影响发送 */ }
                },
                restorePending: function () {
                    try {
                        var raw = localStorage.getItem('pending:' + userId());
                        if (!raw) return;
                        var obj = JSON.parse(raw)
                        for (var id in obj) {
                            if (!this.pending[id]) {
                                this.pending[id] = { msg: obj[id].msg, bubble: null, tries: 0, timer: null }
                            }
                        }
                    } catch (e) { }
                },
                readerCount: function (item) {
                    return item.greaders ? Object.keys(item.greaders).length : 0;
                },
                markGroupReaders: function (data) { // 群逐条已读：我有 seq 的气泡(seq<=ReadSeq)按 Reader 去重累计"N 人已读"
                    var gid = data.ConvId.slice(2), that = this;
                    this.msglist.forEach(function (b) {
                        if (b.ismine && b.seq > 0 && b.msg.Type == 2 && '' + b.msg.TargetId === '' + gid && b.seq <= data.ReadSeq) {
                            var r = b.greaders || {};
                            r[data.Reader] = 1;
                            Vue.set(b, 'greaders', r);
                        }
                    });
                },
                startrecord: function () {

                },
                //跟谁单聊
                sendtxtmsg: function (txt) {
                    if (this.isDisable) {
                        this.setTimeFlag()
                        //{id:1,userid:2,dstid:3,cmd:10,media:1,content:"hello"}
                        var msg = this.createmsgcontext();
                        msg.Media = 1;
                        msg.Content = txt;
                        msg.clientMsgId = this.genMsgId();
                        this.dispatchSend(msg)
                    }
                },
                sendpicmsg: function (picurl) {
                    if (this.isDisable) {
                        this.setTimeFlag()
                        //{id:1,userid:2,dstid:3,cmd:10,media:4,url:"http://www.baidu.com/a/log,jpg"}
                        var msg = this.createmsgcontext();
                        msg.Media = 4;
                        msg.url = picurl;
                        msg.clientMsgId = this.genMsgId();
                        this.dispatchSend(msg)
                    }
                },
                sendaudiomsg: function (url, num) {
                    if (this.isDisable) {
                        this.setTimeFlag()
                        //{id:1,userid:2,dstid:3,cmd:10,media:3,url:"http://www.a,com/dsturl.mp3",anount:40}
                        var msg = this.createmsgcontext();
                        msg.Media = 3;
                        msg.url = url;
                        msg.amount = num;
                        msg.clientMsgId = this.genMsgId();
                        this.dispatchSend(msg)
                    }
                },
                scrollConcat() {
                    console.log(123)
                },
                closePanel() {
                    this.panelstat = 'kbord';
                },
                // ===== P1 会话/未读 =====
                convIdOf: function (type, targetId) {
                    //镜像后端 models/store.go 的 convIdOf：私聊 p_{小}_{大}、群聊 g_{群id}，改动必须两侧同步
                    targetId = parseInt(targetId);
                    if (type == 2) { return "g_" + targetId; }
                    var a = userId(), b = targetId;
                    return a > b ? ("p_" + b + "_" + a) : ("p_" + a + "_" + b);
                },
                currentConvId: function () {
                    if (this.msgcontext.Type != 1 && this.msgcontext.Type != 2) return "";
                    return this.convIdOf(this.msgcontext.Type, this.msgcontext.TargetId);
                },
                unreadOf: function (convId) {
                    return this.unread[convId] || 0;
                },
                loadUnread: function () {
                    var that = this;
                    post("user/unreadList", { userId: userId() }, function (res) {
                        that.unread = res.Data || {};
                    })
                },
                markRead: function (convId) {
                    if (!convId) return;
                    var that = this;
                    post("user/markRead", { userId: userId(), convId: convId }, function (res) {
                        Vue.delete(that.unread, convId);
                    })
                    //拉对端已读游标：私聊气泡回填"已读"状态
                    post("user/readStatus", { convId: convId }, function (res) {
                        if (res.Data && res.Data.readSeq > 0) {
                            that.convReadSeq[convId] = res.Data.readSeq
                            if (that.currentConvId() === convId) { that.markMineAsRead() }
                        }
                    })
                },
                markMineAsRead: function () {
                    var that = this;
                    this.msglist.forEach(function (it) {
                        //回执语义：该会话中我先发的全部气泡均已读（游标以服务端为准，UI 不逐条对账 seq）
                        if (it.ismine && !it.read && it.msg.Type == that.msgcontext.Type && it.msg.TargetId == that.msgcontext.TargetId) {
                            Vue.set(it, "read", true)
                        }
                    });
                },
                bindHistHandler: function (convId, resolve) {
                    //下拉获取历史消息记录（私聊/群聊共用）：先解绑上一个会话的监听，防止每次点击堆叠
                    var wrapper = document.querySelector('.mui-scroll-wrapper');
                    if (this._histHandler && wrapper) {
                        wrapper.removeEventListener('scroll', this._histHandler);
                    }
                    this._histHandler = (e) => {
                        let translate = e.target.style?.transform?.match(/translate3d\(\d+px,\s*(\d+)px,\s*(\d+)px\)/i);
                        if (translate && translate.length > 1) {
                            if (translate[1] > 0 && this.isLoadMore == false) {
                                this.isLoadMore = true;
                                this.start = this.end + 1;
                                this.end = this.end + 2;
                                post("user/redisMsg", { convId: convId, start: this.start, end: this.end, isRev: false }, function (res) {
                                    //循环读取的消息记录 并显示
                                    for (var i in res.Total) {
                                        var msg = JSON.parse(res.Total[i]);
                                        this.showmsg(resolve(msg), msg, true)
                                    }
                                    setTimeout(() => {
                                        this.isLoadMore = false;
                                    }, 300);
                                }.bind(this))
                            }
                        }
                    };
                    if (wrapper) {
                        wrapper.addEventListener('scroll', this._histHandler)
                    }
                },
                // ===== P1 end =====
                singlemsg: function (user) {
                    this.start = 0;
                    this.end = 9;
                    if (this.isDisable) {
                        var convId = this.convIdOf(1, user.ID);
                        //首次读取某个会话的消息记录（热层窗口）
                        if (this.isReadRedisMsg.filter(item => item === convId).length <= 0) {
                            post("user/redisMsg", { convId: convId, start: this.start, end: this.end, isRev: false }, function (res) {
                                //循环读取的消息记录 并显示
                                for (var i in res.Total) {
                                    this.showmsg(user, JSON.parse(res.Total[i]), false, true)
                                }
                            }.bind(this))
                            this.isReadRedisMsg.push(convId)
                        }

                        this.setTimeFlag()
                        //console.log(user)
                        this.win = "single";
                        this.title = "和" + user.Name + "聊天中";
                        this.otherAvatar = user.Avatar;
                        this.msgcontext.TargetId = parseInt(user.ID);
                        this.msgcontext.Type = 1;
                        this.markRead(convId)
                        mui('.mui-scroll-wrapper').scroll({
                            scrollY: true, //是否竖向滚动
                            scrollX: false, //是否横向滚动
                            startX: 0, //初始化时滚动至x
                            startY: 0, //初始化时滚动至y
                            indicators: true, //是否显示滚动条
                            deceleration: 0.0006, //阻尼系数,系数越小滑动越灵敏
                            bounce: true //是否启用回弹
                        });
                        //下拉获取历史消息记录
                        this.bindHistHandler(convId, function (msg) { return user })
                    }
                },
                //群聊的初始化
                groupmsg: function (group) {
                    if (this.isDisable) {
                        this.start = 0;
                        this.end = 9;
                        this.setTimeFlag()
                        this.win = "group";
                        this.title = group.Name;
                        this.msgcontext.TargetId = parseInt(group.ID);
                        this.msgcontext.Type = 2;
                        var that = this;
                        var convId = "g_" + parseInt(group.ID);
                        //群历史统一回读：全员共享 g_{群id} 一个热层窗口
                        if (this.isReadRedisMsg.filter(item => item === convId).length <= 0) {
                            post("user/redisMsg", { convId: convId, start: this.start, end: this.end, isRev: false }, function (res) {
                                for (var i in res.Total) {
                                    var msg = JSON.parse(res.Total[i]);
                                    //成员不在好友缓存时降级占位，不对无路由的 user/find 发请求
                                    var user = that.usermap["" + msg.userId] || { Name: "未知用户", Avatar: "" };
                                    that.showmsg(user, msg, false, true)
                                }
                            })
                            this.isReadRedisMsg.push(convId)
                        }
                        //下拉翻页：按消息发送者解析头像昵称（成员不在好友缓存时降级占位）
                        this.bindHistHandler(convId, (msg) => this.usermap["" + msg.userId] || { Name: "未知用户", Avatar: "" })
                        this.markRead(convId)
                    }
                },
                loaduserinfo: function (userid, cb) {
                    userid = "" + userid;
                    console.log(">>>> " + userid)
                    var userinfo = this.usermap[userid];
                    if (!userinfo) {
                        post("user/find", { userId: parseInt(userid) }, function (res) {
                            cb(res.Data);
                            this.usermap[userid] = res.Data;
                        }.bind(this))
                    } else {
                        cb(userinfo)
                    }
                },
                onmessage: function (data) {
                    if (data.Type === 6) {
                        //服务端发送确认(仅服务端→客户端)：按 clientMsgId 定气泡状态，绝不进 msglist
                        this.ackMsg(data)
                        return
                    }
                    if (data.Type === 5) {
                        //已读回执：私聊记游标标"已读"；群聊(逐条)按 Reader 给我有 seq 的气泡累计"N 人已读"
                        this.convReadSeq[data.ConvId] = data.ReadSeq
                        if (data.ConvId === this.currentConvId()) {
                            if (data.ConvId.indexOf('g_') === 0) {
                                this.markGroupReaders(data)
                            } else {
                                this.markMineAsRead()
                            }
                        }
                        return
                    }
                    if (data.Type === 4) {
                        //未读事件(仅服务端→客户端)：命中当前会话直接清成已读，否则刷新角标；绝不能进 msglist
                        if (data.ConvId === this.currentConvId()) {
                            this.markRead(data.ConvId)
                        } else {
                            Vue.set(this.unread, data.ConvId, data.Unread)
                        }
                        return
                    }
                    //业务消息接收端幂等：落盘后置分发是 at-least-once，同会话同 clientMsgId 只渲染一次
                    if (data.clientMsgId) {
                        var cid = (data.Type === 1 || data.Type === 2) ? this.convIdOf(data.Type, data.TargetId) : (this.currentConvId() || '_')
                        var bucket = this.seenIds[cid]
                        if (!bucket) { bucket = this.seenIds[cid] = { n: 0 } }
                        if (bucket[data.clientMsgId]) return
                        bucket[data.clientMsgId] = 1
                        // 每会话封顶 200：按插入序淘汰最旧键（对象键序在 V8 下对字符串键稳定）
                        if (++bucket.n > 200) {
                            for (var k in bucket) {
                                if (k !== 'n') { delete bucket[k]; break }
                            }
                            bucket.n--
                        }
                    }
                    this.loaduserinfo(data.userId, function (user) {

                        this.showmsg(user, data)
                        this.friends.map((item) => {
                            if (item.ID == data.userId) {
                                // 1文字 2表情包 3图片 4音频
                                if (data.Media === 1) {
                                    item.memo = data.Content
                                } else if (data.Media === 2) {
                                    item.memo = data.Url
                                } else if (data.Media === 3) {
                                    item.memo = "[语音]"
                                } else if (data.Media === 4) {
                                    item.memo = "[图片]"
                                }
                            }
                        })

                    }.bind(this))

                },
                initwebsocket: function () {
                    var url = "ws://" + location.host + "/chat?userId=" + userId() + "&token=" + util.parseQuery("token") + "&deviceId=" + this.deviceId;
                    this.webSocket = new WebSocket(url);
                    //消息处理：JSON 帧以 '{' 开头 + parse 成功双判据（indexOf("}") 会被含 '}' 的纯文本误判）
                    this.webSocket.onmessage = function (evt) {
                        var s = evt.data
                        if (typeof s === "string" && s.charAt(0) === '{') {
                            try {
                                this.onmessage(JSON.parse(s));
                            } catch (e) {
                                console.log("recv unparsable<==" + s)
                            }
                        } else {
                            console.log("recv<==" + s)
                        }
                    }.bind(this)
                    //打开成功：补偿断线/离线期间的未读变化 + pending 未确认消息全量重发；重连计数清零
                    this.webSocket.onopen = function (evt) {
                        this.reconnTries = 0
                        this.loadUnread()
                        this.flushPending()
                    }.bind(this)
                    //关闭回调：非正常关闭（如被踢/网络断）自动退避重连，≤10 次；
                    //服务端正常关闭(1000/1001)不重连。重连成功由 onopen 补 unread + pending。
                    this.webSocket.onclose = function (evt) {
                        console.log("连接关闭 code=" + (evt && evt.code))
                        if (evt && (evt.code === 1000 || evt.code === 1001)) return
                        if (this.reconnTries >= 10) {
                            mui.toast("连接已断开且重连超限，请刷新页面重新登录")
                            return
                        }
                        var that = this
                        var backoff = Math.min(15000, 1000 * Math.pow(2, this.reconnTries++))
                        setTimeout(function () { that.initwebsocket() }, backoff)
                    }.bind(this)
                    //出错回调
                    this.webSocket.onerror = function (evt) {
                        console.log(evt.data)
                    }
                    /*{
                        this.webSocket.send()
                    }*/
                },
