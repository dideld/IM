mysql:
  dns: root:111111@tcp(host.docker.internal:3306)/ginchat?charset=utf8mb4&parseTime=True&loc=Local
redis:
  addr: "host.docker.internal:6379"
  password: ""
  DB: 0
  poolSize: 500
  minIdleConn: 100
kafka:
  broker: "host.docker.internal:9092"
  topic: "chat_messages"
  consumerGroup: "chat_redis_saver_group"
storage:
  hotKeep: 200        # Redis 热层单会话保留的最大消息条数（超出修剪最旧的）
  hotTTLDays: 7       # 热层 ZSet 滑动过期天数
  coldBatchSize: 100  # MySQL 冷存储批量落盘条数
  coldFlushMs: 200    # 冷存储批量落盘最长等待毫秒
timeout:
  DelayHeartbeat: 60   #延迟心跳时间  单位秒
port:
  server: "0.0.0.0:8081"
  udp: 3001
upload:
  path: "./asset/upload"
